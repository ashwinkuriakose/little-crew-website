<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Demo-only sample of a 1920x1080 banner ad: artwork kept in the right 60% -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0a45"/><stop offset="0.55" stop-color="#8a1c5c"/><stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.72" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#spot)"/>
  <circle cx="1420" cy="520" r="300" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="1420" cy="520" r="210" fill="#1b0a2a" fill-opacity="0.35"/>
  <text x="1420" y="500" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="120" fill="#fff">LIVE</text>
  <text x="1420" y="610" text-anchor="middle" font-family="Arial" font-weight="700" font-size="54" fill="#ffd166">NEW YEAR 2027</text>
  <text x="1420" y="900" text-anchor="middle" font-family="Arial" font-size="34" fill="#fff" fill-opacity="0.8">Sample banner ad · 1920 × 1080</text>
</svg>
